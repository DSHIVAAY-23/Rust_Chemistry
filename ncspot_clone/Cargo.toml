[package]
name = "ncspot_clone"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.27"  # TUI interaction
ratatui = "0.26"  # Terminal UI rendering (similar to ncurses)
reqwest = { version = "0.11", features = ["json"] }  # HTTP client for Spotify API
serde = { version = "1.0", features = ["derive"] }  # JSON parsing
tokio = { version = "1", features = ["full"] }  # Async runtime
rspotify = { version = "0.11", features = ["cli", "ureq"] }  # Spotify API client
librespot = { version = "0.4", features = ["playback"] }  # Spotify playback